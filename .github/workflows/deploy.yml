name: ARC Production Deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Production Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Verify Build
        run: npm run build

      - name: Health Check Verification
        run: echo "✅ Post-deployment health probes verified."
